name: Build and Deploy
on:
  push:
    branches:
      - main
    paths:
        - 'app/**'
        - '!k8s/apps/**'

  workflow_dispatch:
    
env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

concurrency:
    group: build-and-push-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        outputs:
            image_uri: ${{ steps.set-image.outputs.image_uri }}

        steps:
        # Trust policy in terraform/bootstrap only allows refs/heads/main.
        # Fail fast on a workflow_dispatch from any other branch.
        - name: Guard branch
          run: |
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::This workflow only runs on main. Got ref='${GITHUB_REF}'."
              exit 1
            fi

        - name: Checkout code
          uses: actions/checkout@v4

        # Prints the exact claims that STS will compare against the trust policy.
        - name: Debug OIDC context
          env:
            BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
          run: |
            echo "repository (must match var.github_repo, case-sensitive): ${{ github.repository }}"
            echo "ref        (must be refs/heads/main):                    ${{ github.ref }}"
            echo "event                                                   : ${{ github.event_name }}"
            echo "expected sub: repo:${{ github.repository }}:ref:${{ github.ref }}"
            echo "BUILD_ROLE set: $([ -n \"$BUILD_ROLE\" ] && echo yes || echo NO)"

        - name: Configure AWS credentials via OIDC
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.BUILD_ROLE }}
            aws-region: ${{ env.AWS_REGION }}
            role-session-name: github-build-role
            audience: sts.amazonaws.com

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2
           
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Set image tag
          id: tag
          run: |
            SHORT_SHA=${GITHUB_SHA::8}
            echo "IMAGE_TAG=git-${SHORT_SHA}" >> $GITHUB_OUTPUT

        - name: Build Docker image
          uses: docker/build-push-action@v6
          with:
            context: ./app
            file: ./app/Dockerfile
            load: true
            push: false
            tags: local-image:scan
            cache-from: type=gha
            cache-to: type=gha,mode=max
            platforms: linux/amd64

        - name: Scan image for vulnerabilities
          uses: aquasecurity/trivy-action@v0.35.0
          with:
            image-ref: local-image:scan
            format: 'table'
            exit-code: "1"
            severity: CRITICAL

        - name: Tag and Push Docker image
          id: set-image
          run: |
            IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.IMAGE_TAG }}
            docker tag local-image:scan "$IMAGE_URI"
            docker push "$IMAGE_URI"
            echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            ref: main
            # Persist the workflow token so the later git push is authenticated.
            persist-credentials: true
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update deployment
          run: |
            IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
            sed -i "s|image: .*|image: ${IMAGE_URI}|" k8s/app/deployment.yaml
            if git diff --quiet k8s/app/deployment.yaml; then
              echo "No changes to deployment.yaml"
            else
              echo "Deployment image updated to ${IMAGE_URI}"
            fi
            git diff k8s/app/deployment.yaml || true

        - name: Commit and push changes
          run: |
            IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/app/deployment.yaml
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Update deployment image to ${IMAGE_URI}"
            git push origin HEAD:main