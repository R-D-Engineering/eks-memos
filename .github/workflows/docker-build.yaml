name: Build and Deploy
on:
  push:
    branches:
      - main
    paths:
        - 'app/**'
        - '!k8s/apps/**'

  workflow_dispatch:
    
env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

concurrency:
    group: build-and-push-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        outputs:
            image_uri: ${{ steps.set-image.outputs.image_uri }}

        steps:
        # Trust policy in terraform/bootstrap only allows refs/heads/main.
        # Fail fast on a workflow_dispatch from any other branch.
        - name: Guard branch
          run: |
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::This workflow only runs on main. Got ref='${GITHUB_REF}'."
              exit 1
            fi

        - name: Checkout code
          uses: actions/checkout@v4

        # The org enforces immutable actor/repo IDs in the OIDC subject claim,
        # so `sub` looks like repo:<owner>@<owner_id>/<repo>@<repo_id>:ref:...
        # Patch the four bootstrap roles' trust policies to accept that format
        # (idempotent - safe to run every build).
        - name: Reconcile OIDC trust policies
          env:
            AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION:    ${{ env.AWS_REGION }}
          run: |
            set -euo pipefail
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            OWNER="${GITHUB_REPOSITORY%%/*}"
            NAME="${GITHUB_REPOSITORY##*/}"
            PROVIDER_ARN="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
            SUB_PATTERN="repo:${OWNER}*/${NAME}*:ref:refs/heads/main"

            POLICY=$(jq -cn --arg p "$PROVIDER_ARN" --arg s "$SUB_PATTERN" '{
              Version: "2012-10-17",
              Statement: [{
                Effect: "Allow",
                Principal: { Federated: $p },
                Action: "sts:AssumeRoleWithWebIdentity",
                Condition: {
                  StringEquals: { "token.actions.githubusercontent.com:aud": "sts.amazonaws.com" },
                  StringLike:   { "token.actions.githubusercontent.com:sub": $s }
                }
              }]
            }')
            echo "New trust policy:"
            echo "$POLICY" | jq .

            for ROLE in memos-ecr-github-actions-role terraform-plan-role terraform-apply-role terraform-destroy-role; do
              if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
                echo "Updating trust policy on $ROLE"
                aws iam update-assume-role-policy --role-name "$ROLE" --policy-document "$POLICY"
              else
                echo "Role $ROLE not found - skipping"
              fi
            done

        - name: Configure AWS credentials via OIDC
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.BUILD_ROLE }}
            aws-region: ${{ env.AWS_REGION }}
            role-session-name: github-build-role
            audience: sts.amazonaws.com

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2
           
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Set image tag
          id: tag
          run: |
            SHORT_SHA=${GITHUB_SHA::8}
            echo "IMAGE_TAG=git-${SHORT_SHA}" >> $GITHUB_OUTPUT

        - name: Build Docker image
          uses: docker/build-push-action@v6
          with:
            context: ./app
            file: ./app/Dockerfile
            load: true
            push: false
            tags: local-image:scan
            cache-from: type=gha
            cache-to: type=gha,mode=max
            platforms: linux/amd64

        - name: Scan image for vulnerabilities
          uses: aquasecurity/trivy-action@v0.35.0
          with:
            image-ref: local-image:scan
            format: 'table'
            exit-code: "1"
            severity: CRITICAL

        - name: Tag and Push Docker image
          id: set-image
          run: |
            IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.IMAGE_TAG }}
            docker tag local-image:scan "$IMAGE_URI"
            docker push "$IMAGE_URI"
            echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            ref: main
            # Persist the workflow token so the later git push is authenticated.
            persist-credentials: true
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update deployment
          run: |
            IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
            sed -i "s|image: .*|image: ${IMAGE_URI}|" k8s/app/deployment.yaml
            if git diff --quiet k8s/app/deployment.yaml; then
              echo "No changes to deployment.yaml"
            else
              echo "Deployment image updated to ${IMAGE_URI}"
            fi
            git diff k8s/app/deployment.yaml || true

        - name: Commit and push changes
          run: |
            IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/app/deployment.yaml
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Update deployment image to ${IMAGE_URI}"
            git push origin HEAD:main