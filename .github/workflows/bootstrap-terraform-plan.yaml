name: Bootstrap Terraform Plan

on:
    workflow_run:
        workflows: ["Build and Deploy"]
        types:
          - completed
    workflow_dispatch:

concurrency:
    group: terraform-plan
    cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}

jobs:
    terraform-plan:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

        permissions:
            contents: read
            id-token: write

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            ref: ${{ github.event.workflow_run.head_sha || github.sha }}

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Setup TFLint
          uses: terraform-linters/setup-tflint@v6
          with:
            tflint_version: v0.56.0

        - name: Init TFLint
          working-directory: terraform/bootstrap
          run: tflint --init
      
        - name: Run TFLint
          working-directory: terraform/bootstrap
          run: tflint

        - name: Setup Checkov
          uses: bridgecrewio/checkov-action@v12
          with:
            directory: terraform/bootstrap
            soft_fail: true

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v4
          with:
            terraform_version: 1.15.0

        - name: Terraform Init
          working-directory: terraform/bootstrap
          run: terraform init

        # First-run adoption: import any resources that already exist in AWS
        # but are missing from Terraform state. Idempotent: subsequent runs
        # short-circuit when the resource is already in state.
        - name: Adopt pre-existing AWS resources into state
          working-directory: terraform/bootstrap
          env:
            AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          run: |
            set -uo pipefail
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

            adopt() {
              local addr="$1" id="$2"
              if terraform state show "$addr" >/dev/null 2>&1; then
                echo "already in state: $addr"
                return
              fi
              echo "importing $addr <- $id"
              terraform import -input=false -lock-timeout=2m "$addr" "$id" \
                || echo "skip: $addr (not present in AWS or not importable)"
            }

            adopt 'aws_s3_bucket.s3_bucket'                         'memos-tfstate'
            adopt 'aws_ecr_repository.ecr_repository'               'memos-ecr'
            adopt 'aws_iam_openid_connect_provider.github'          "arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
            adopt 'aws_iam_role.github_actions_role'                'memos-ecr-github-actions-role'
            adopt 'aws_iam_role.terraform_plan'                     'terraform-plan-role'
            adopt 'aws_iam_role.terraform_apply'                    'terraform-apply-role'
            adopt 'aws_iam_role.terraform_destroy'                  'terraform-destroy-role'

        - name: Terraform format
          working-directory: terraform/bootstrap
          run: terraform fmt -check

        - name: Terraform Validate
          working-directory: terraform/bootstrap
          run: terraform validate

        - name: Terraform Plan
          working-directory: terraform/bootstrap
          run: terraform plan -input=false -lock-timeout=2m -out=tfplan

        - name: Upload Terraform Plan
          uses: actions/upload-artifact@v4
          with:
            name: terraform-plan
            path: terraform/bootstrap/tfplan